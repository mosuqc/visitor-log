<style>
  /* Kiosk-style sign-in — clean, high-contrast, big touch targets */
  :root {
    --bg: #D9DDDF;
    --surface: #FFFFFF;
    --fg: #1A1A1A;
    --fg-muted: #5A5A5A;
    --accent: #B8C5CA;
    --accent-hover: #A3B2B8;
    --accent-fg: #1A1A1A;
    --border: #C4CACC;
    --success: #2E7D4F;
    --font-body: 'Instrument Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1E20;
      --surface: #252A2D;
      --fg: #E4E8EA;
      --fg-muted: #8A9298;
      --accent: #3A464C;
      --accent-hover: #4A575E;
      --accent-fg: #E4E8EA;
      --border: #2E3538;
      --success: #4CAF6E;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1E20;
    --surface: #252A2D;
    --fg: #E4E8EA;
    --fg-muted: #8A9298;
    --accent: #3A464C;
    --accent-hover: #4A575E;
    --accent-fg: #E4E8EA;
    --border: #2E3538;
    --success: #4CAF6E;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding-inline: 24px;
    padding-block: 0;
    margin: 0;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  /* ---- Screens ---- */
  .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 480px; }
  .screen.active { display: flex; }

  /* ---- Home screen ---- */
  #home { gap: 20px; }
  .home-logo { width: min(320px, 80%); margin-bottom: .5rem; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .home-logo { filter: invert(1); }
  }
  :root[data-theme="dark"] .home-logo { filter: invert(1); }
  .home-btn {
    width: 100%;
    padding: 52px 24px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-fg);
    font-family: var(--font-body);
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .home-btn:active { transform: scale(0.98); background: var(--accent-hover); }

  /* ---- Type selection ---- */
  #type-select { gap: 16px; }
  #type-select h2 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--fg-muted);
  }
  .type-btn {
    width: 100%;
    padding: 36px 24px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1.5rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .type-btn:active { transform: scale(0.98); border-color: var(--accent); }

  /* ---- Sign-in form ---- */
  #form-screen { gap: 0; }
  #form-screen h2 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 28px;
    color: var(--fg-muted);
    align-self: flex-start;
  }
  .field { width: 100%; margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    box-sizing: border-box;
    padding: 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1.15rem;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--fg-muted); opacity: 0.5; }
  .field input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .field input[type="date"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  /* Hide number spinners */
  .field input[type="number"]::-webkit-inner-spin-button,
  .field input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .field input[type="number"] { -moz-appearance: textfield; }

  .done-btn {
    width: 100%;
    padding: 20px;
    margin-top: 8px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-fg);
    font-family: var(--font-body);
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .done-btn:active { transform: scale(0.98); background: var(--accent-hover); }
  .done-btn:disabled { opacity: 0.4; pointer-events: none; }

  /* ---- Confirmation ---- */
  #confirm { gap: 12px; text-align: center; }

  /* ---- Sign-out screen ---- */
  #sign-out { gap: 16px; }
  #sign-out h2 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--fg-muted);
  }
  .visitor-card {
    width: 100%;
    box-sizing: border-box;
    padding: 18px 20px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .visitor-card:active { transform: scale(0.98); border-color: var(--accent); }
  .visitor-card .info { display: flex; flex-direction: column; gap: 2px; }
  .visitor-card .name { font-size: 1.15rem; font-weight: 600; }
  .visitor-card .meta { font-size: 0.85rem; color: var(--fg-muted); }
  .visitor-card .time-in { font-family: var(--font-mono); font-size: 0.9rem; color: var(--fg-muted); white-space: nowrap; }
  .no-visitors { text-align: center; color: var(--fg-muted); font-size: 1.1rem; padding: 40px 0; }

  /* ---- Back button ---- */
  .back-btn {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 20px;
    background: none;
    border: none;
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    padding: 8px 4px;
    -webkit-tap-highlight-color: transparent;
    display: none;
  }
  .back-btn.visible { display: block; }
  .back-btn svg { width: 20px; height: 20px; vertical-align: middle; margin-right: 2px; }

  /* ---- Gear icon ---- */
  .gear-btn {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    right: 18px;
    background: none;
    border: none;
    padding: 8px;
    cursor: pointer;
    opacity: 0.25;
    transition: opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .gear-btn:active { opacity: 0.5; }
  .gear-btn svg { width: 22px; height: 22px; fill: var(--fg); }

  /* ---- Corner logo (non-home screens) ---- */
  .corner-logo {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    right: 18px;
    width: 80px;
    opacity: 0.18;
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .corner-logo { filter: invert(1); }
  }
  :root[data-theme="dark"] .corner-logo { filter: invert(1); }

  /* ---- Modal overlay ---- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
  }
  .modal-backdrop[hidden] { display: none !important; }
  .modal {
    background: var(--surface);
    padding: 28px 24px;
    border-radius: var(--radius);
    max-width: 380px;
    width: 90%;
  }
  .modal h3 {
    margin: 0 0 20px;
    font-size: 1.2rem;
    font-weight: 700;
  }
  .modal .field { margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-cancel {
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--fg);
  }
  .modal-confirm {
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
  }
  .modal-confirm:disabled { opacity: 0.4; pointer-events: none; }
  .pw-error {
    color: #C0392B;
    font-size: 0.85rem;
    margin-top: 6px;
    display: none;
  }

  .unit-error {
    color: #C0392B;
    font-size: 0.85rem;
    margin-top: 6px;
  }

  /* ---- Admin panel ---- */
  #admin-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 100;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 24px calc(env(safe-area-inset-bottom, 0px) + 16px);
    overflow-y: auto;
  }
  #admin-overlay[hidden] { display: none !important; }
  #admin-overlay:not([hidden]) { display: flex; }
  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .admin-header h2 { font-size: 1.4rem; font-weight: 700; margin: 0; }
  .admin-close {
    background: none; border: none;
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 1rem; font-weight: 600;
    cursor: pointer; padding: 8px 4px;
    -webkit-tap-highlight-color: transparent;
  }

  .admin-btn {
    width: 100%;
    padding: 18px 20px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    margin-bottom: 12px;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s;
  }
  .admin-btn:active { border-color: var(--accent); }
  .admin-btn .btn-sub { display: block; font-size: 0.85rem; font-weight: 400; color: var(--fg-muted); margin-top: 4px; }

  .clear-btn {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: 2px solid #C0392B;
    border-radius: 10px;
    background: none;
    color: #C0392B;
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- Report generation steps ---- */
  .report-step { display: none; }
  .report-step.active { display: block; }
  .format-option {
    width: 100%;
    padding: 20px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1.15rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s;
  }
  .format-option:active { border-color: var(--accent); }

  .overflow-x { overflow-x: auto; }
  .report-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  .report-table th {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 2px solid var(--border);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    white-space: nowrap;
  }
  .report-table td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);

    <label for="nameInput">Your Name</label>
    <input type="text" id="nameInput" placeholder="First and last name" autocomplete="off" autocapitalize="words">
  </div>
  <div class="field">
    <label for="roomInput">Unit</label>
    <input type="number" id="roomInput" placeholder="000" min="0" max="999" autocomplete="off" inputmode="numeric">
    <div class="unit-error" id="unitError" hidden>Please enter a valid unit number.</div>
  </div>
  <div class="field">
    <label for="reasonInput">Reason for Visit</label>
    <input type="text" id="reasonInput" placeholder="e.g. Scheduled appointment" autocomplete="off">
  </div>
  <button class="done-btn" id="doneBtn" onclick="submitSignIn()" disabled>Done</button>
</div>

<!-- Confirmation -->
<div class="screen" id="confirm">
  <h2 id="confirmGreeting" style="font-size:1.8rem;font-weight:700;margin:0 0 12px;text-align:center;line-height:1.3;"></h2>
  <p id="confirmStatus" style="margin:0;font-size:1.15rem;font-style:italic;color:var(--fg-muted);display:flex;align-items:center;gap:8px;justify-content:center;"></p>
</div>

<!-- Sign Out: Room lookup -->
<div class="screen" id="sign-out-room">
  <h2>Unit #</h2>
  <div class="field">
    <input type="number" id="signOutRoomInput" placeholder="000" min="0" max="999" autocomplete="off" inputmode="numeric">
    <div class="unit-error" id="unitErrorOut" hidden>Please enter a valid unit number.</div>
  </div>
  <button class="done-btn" id="signOutRoomBtn" onclick="lookupRoom()" disabled>Next</button>
</div>

<!-- Sign Out: Visitor list for that room -->
<div class="screen" id="sign-out">
  <h2 id="signOutTitle">Who is signing out?</h2>
  <div id="activeVisitors"></div>
</div>

<!-- Gear -->
<button class="gear-btn" id="gearBtn" onclick="promptPassword()">
  <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.97l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.67-.97l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.59-1.67.97l-2.49-1a.49.49 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.97s.03.66.07.97l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.5.38 1.06.72 1.67.97l.38 2.65c.05.24.26.42.49.42h4c.24 0 .44-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.67-.97l2.49 1c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65z"/></svg>
</button>

<img class="corner-logo" id="cornerLogo" alt="" hidden>

<!-- Password modal -->
<div class="modal-backdrop" id="pwModal" hidden>
  <div class="modal">
    <h3>Enter Password</h3>
    <div class="field">
      <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
      <div class="pw-error" id="pwError">Incorrect password</div>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closePwModal()">Cancel</button>
      <button class="modal-confirm" onclick="checkPassword()">Enter</button>
    </div>
  </div>
</div>

<!-- Admin panel -->
<div id="admin-overlay" hidden>
  <div class="admin-header">
    <h2>Admin</h2>
    <button class="admin-close" onclick="closeAdmin()">Close</button>
  </div>

  <!-- Step 1: Menu -->
  <div class="report-step active" id="adminMenu">
    <button class="admin-btn" onclick="showReportStep('dateRange')">
      Generate Report
      <span class="btn-sub">Export visitor log as PDF or Excel</span>
    </button>
    <button class="admin-btn" onclick="showLogView()">
      View Log
      <span class="btn-sub">Browse recent visitor entries</span>
    </button>
    <button class="clear-btn" onclick="clearData()">Clear All Data</button>
  </div>

  <!-- Step 2: Date range -->
  <div class="report-step" id="dateRange">
    <h3 style="margin:0 0 20px;font-size:1.1rem;font-weight:600;color:var(--fg-muted);">Select Date Range</h3>
    <div class="field">
      <label for="startDate">Start Date</label>
      <input type="date" id="startDate">
    </div>
    <div class="field">
      <label for="endDate">End Date</label>
      <input type="date" id="endDate">
    </div>
    <button class="done-btn" id="dateNextBtn" onclick="showReportStep('formatChoice')">Next</button>
    <button class="admin-btn" style="margin-top:12px;text-align:center;" onclick="showReportStep('adminMenu')">Back</button>
  </div>

  <!-- Step 3: Format -->
  <div class="report-step" id="formatChoice">
    <h3 style="margin:0 0 20px;font-size:1.1rem;font-weight:600;color:var(--fg-muted);">Export Format</h3>
    <button class="format-option" onclick="generateReport('pdf')">PDF</button>
    <button class="format-option" onclick="generateReport('excel')">Excel</button>
    <button class="admin-btn" style="margin-top:4px;text-align:center;" onclick="showReportStep('dateRange')">Back</button>
  </div>

  <!-- Log view -->
  <div class="report-step" id="logView">
    <div class="report-filters">
      <button class="filter-btn active" onclick="filterLog('today', this)">Today</button>
      <button class="filter-btn" onclick="filterLog('week', this)">This Week</button>
      <button class="filter-btn" onclick="filterLog('month', this)">This Month</button>
      <button class="filter-btn" onclick="filterLog('all', this)">All</button>
    </div>
    <div class="overflow-x">
      <div id="logContent"></div>
    </div>
    <button class="admin-btn" style="margin-top:16px;text-align:center;" onclick="showReportStep('adminMenu')">Back</button>
  </div>
</div>

<script>
  const DB_KEY = 'visitor_log';
  const ADMIN_PW = 'Preston123';
  const VALID_UNITS = new Set([
    '000',
    ...Array.from({length: 16}, (_, i) => String(101 + i).padStart(3, '0')), // 101-116
    '117', '119',
    ...Array.from({length: 5}, (_, i) => String(201 + i).padStart(3, '0')),  // 201-205
    ...Array.from({length: 23}, (_, i) => String(207 + i).padStart(3, '0')), // 207-229
    ...Array.from({length: 5}, (_, i) => String(301 + i).padStart(3, '0')),  // 301-305
    ...Array.from({length: 21}, (_, i) => String(307 + i).padStart(3, '0')), // 307-327
    '329',
    ...Array.from({length: 27}, (_, i) => String(401 + i).padStart(3, '0')), // 401-427
    '429',
    '999'
  ]);
  function isValidUnit(u) { return VALID_UNITS.has(u); }
  let currentType = '';
  let screenHistory = ['home'];

  // --- Data ---
  function getLog() {
    try { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); } catch(e) { return []; }
  }
  function saveLog(log) {
    try { localStorage.setItem(DB_KEY, JSON.stringify(log)); } catch(e) {}
  }

  // --- Navigation ---
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    screenHistory.push(id);
    document.getElementById('backBtn').classList.toggle('visible', id !== 'home');
    document.getElementById('gearBtn').hidden = id !== 'home';
    document.getElementById('cornerLogo').hidden = id === 'home';
  }

  function goBack() {
    screenHistory.pop();
    const prev = screenHistory[screenHistory.length - 1] || 'home';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(prev).classList.add('active');
    document.getElementById('backBtn').classList.toggle('visible', prev !== 'home');
    document.getElementById('gearBtn').hidden = prev !== 'home';
    document.getElementById('cornerLogo').hidden = prev === 'home';
  }

  function goHome() {
    screenHistory = ['home'];
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('home').classList.add('active');
    document.getElementById('backBtn').classList.remove('visible');
    document.getElementById('gearBtn').hidden = false;
    document.getElementById('cornerLogo').hidden = true;
    clearForm();
  }

  // Set corner logo src from home logo
  document.getElementById('cornerLogo').src = document.querySelector('.home-logo').src;

  // --- Type selection ---
  function selectType(type) {
    currentType = type;
    document.getElementById('formTitle').textContent = 'Sign In — ' + type;
    clearForm();
    if (type === 'Vendor') {
      document.getElementById('roomInput').value = '999';
      validateForm();
    }
    showScreen('form-screen');
    document.getElementById('nameInput').focus();
  }

  // --- Form ---
  function clearForm() {
    document.getElementById('nameInput').value = '';
    document.getElementById('roomInput').value = '';
    document.getElementById('reasonInput').value = '';
    document.getElementById('doneBtn').disabled = true;
    document.getElementById('unitError').hidden = true;
  }

  ['nameInput', 'roomInput', 'reasonInput'].forEach(id => {
    document.getElementById(id).addEventListener('input', validateForm);
  });

  document.getElementById('roomInput').addEventListener('input', function() {
    if (this.value.length > 3) this.value = this.value.slice(0, 3);
    document.getElementById('unitError').hidden = true;
  });

  function validateForm() {
    const name = document.getElementById('nameInput').value.trim();
    const room = document.getElementById('roomInput').value.trim();
    const reason = document.getElementById('reasonInput').value.trim();
    document.getElementById('doneBtn').disabled = !(name && room && reason);
  }

  // --- Submit ---
  function submitSignIn() {
    const name = document.getElementById('nameInput').value.trim();
    const room = document.getElementById('roomInput').value.trim().padStart(3, '0');
    const reason = document.getElementById('reasonInput').value.trim();

    const errEl = document.getElementById('unitError');
    if (!isValidUnit(room)) {
      errEl.hidden = false;
      document.getElementById('roomInput').focus();
      return;
    }
    errEl.hidden = true;

    const now = new Date();

    const entry = {
      id: Date.now(),
      name,
      type: currentType,
      room,
      reason,
      timeIn: now.toISOString(),
      timeOut: null
    };

    const log = getLog();
    log.push(entry);
    saveLog(log);

    document.getElementById('confirmGreeting').textContent = 'It\'s good to see you, ' + name + '.';
    document.getElementById('confirmStatus').innerHTML = 'signed in <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--success)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> <span style="color:var(--success);font-weight:600;font-style:normal;">' + formatTime(now) + '</span>';
    showScreen('confirm');
    setTimeout(goHome, 2500);
  }

  // --- Sign Out ---
  function showSignOutRoom() {
    document.getElementById('signOutRoomInput').value = '';
    document.getElementById('signOutRoomBtn').disabled = true;
    showScreen('sign-out-room');
    document.getElementById('signOutRoomInput').focus();
  }

  const signOutRoomEl = document.getElementById('signOutRoomInput');
  signOutRoomEl.addEventListener('input', function() {
    if (this.value.length > 3) this.value = this.value.slice(0, 3);
    document.getElementById('signOutRoomBtn').disabled = !this.value.trim();
    document.getElementById('unitErrorOut').hidden = true;
  });

  function lookupRoom() {
    const room = document.getElementById('signOutRoomInput').value.trim().padStart(3, '0');

    const errEl = document.getElementById('unitErrorOut');
    if (!isValidUnit(room)) {
      errEl.hidden = false;
      document.getElementById('signOutRoomInput').focus();
      return;
    }
    errEl.hidden = true;

    const log = getLog();
    const active = log.filter(e => !e.timeOut && e.room === room);
    const container = document.getElementById('activeVisitors');
    container.innerHTML = '';

    document.getElementById('signOutTitle').textContent = 'Unit #' + room;

    if (active.length === 0) {
      container.innerHTML = '<div class="no-visitors">No visitors currently signed in to this unit</div>';
    } else {
      active.forEach(entry => {
        const card = document.createElement('button');
        card.className = 'visitor-card';
        card.innerHTML = `
          <div class="info">
            <span class="name">${esc(entry.name)}</span>
            <span class="meta">${formatTime(new Date(entry.timeIn))}</span>
          </div>
        `;
        card.onclick = () => signOut(entry.id);
        container.appendChild(card);
      });
    }
    showScreen('sign-out');
  }

  function signOut(id) {
    const log = getLog();
    const entry = log.find(e => e.id === id);
    if (entry) {
      entry.timeOut = new Date().toISOString();
      saveLog(log);
    }
    const outName = entry ? entry.name : '';
    document.getElementById('confirmGreeting').textContent = 'See you next time, ' + outName + '!';
    document.getElementById('confirmStatus').innerHTML = 'signed out <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--success)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> <span style="color:var(--success);font-weight:600;font-style:normal;">' + formatTime(new Date()) + '</span>';
    showScreen('confirm');
    setTimeout(goHome, 2500);
  }

  // --- Password ---
  function promptPassword() {
    document.getElementById('pwInput').value = '';
    document.getElementById('pwError').style.display = 'none';
    document.getElementById('pwModal').hidden = false;
    document.getElementById('pwInput').focus();
  }

  function closePwModal() {
    document.getElementById('pwModal').hidden = true;
  }

  function checkPassword() {
    const val = document.getElementById('pwInput').value;
    if (val === ADMIN_PW) {
      closePwModal();
      openAdmin();
    } else {
      document.getElementById('pwError').style.display = 'block';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }

  // Allow Enter key on password field
  document.getElementById('pwInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPassword();
  });

  // --- Admin panel ---
  function openAdmin() {
    document.getElementById('admin-overlay').hidden = false;
    showReportStep('adminMenu');
    // Default date range: start of month to today
    const today = new Date();
    const startOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    document.getElementById('endDate').value = fmtDateInput(today);
    document.getElementById('startDate').value = fmtDateInput(startOfMonth);
  }

  function closeAdmin() {
    document.getElementById('admin-overlay').hidden = true;
  }

  function showReportStep(stepId) {
    document.querySelectorAll('.report-step').forEach(s => s.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
  }

  function showLogView() {
    showReportStep('logView');
    filterLog('today', document.querySelector('#logView .filter-btn'));
  }

  // --- Log viewer ---
  function filterLog(range, btn) {
    document.querySelectorAll('#logView .filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const log = getLog();
    const now = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startOfWeek = new Date(startOfDay);
    startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

    let filtered = log;
    if (range === 'today') filtered = log.filter(e => new Date(e.timeIn) >= startOfDay);
    else if (range === 'week') filtered = log.filter(e => new Date(e.timeIn) >= startOfWeek);
    else if (range === 'month') filtered = log.filter(e => new Date(e.timeIn) >= startOfMonth);

    const container = document.getElementById('logContent');
    if (filtered.length === 0) {
      container.innerHTML = '<div class="report-empty">No entries for this period</div>';
      return;
    }

    filtered.sort((a, b) => new Date(b.timeIn) - new Date(a.timeIn));

    let html = '<table class="report-table"><thead><tr>';
    html += '<th>Date</th><th>Name</th><th>Unit</th><th>Type</th><th>Reason</th><th>In</th><th>Out</th>';
    html += '</tr></thead><tbody>';
    filtered.forEach(e => {
      const din = new Date(e.timeIn);
      html += `<tr>
        <td class="mono" style="white-space:nowrap">${din.toLocaleDateString('en-US', { month:'short', day:'numeric' })}</td>
        <td>${esc(e.name)}</td>
        <td class="mono">${esc(e.room)}</td>
        <td>${esc(e.type)}</td>
        <td>${esc(e.reason)}</td>
        <td class="mono" style="white-space:nowrap">${formatTime(din)}</td>
        <td class="mono">${e.timeOut ? formatTime(new Date(e.timeOut)) : '—'}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  // --- Report generation ---
  function generateReport(format) {
    const startStr = document.getElementById('startDate').value;
    const endStr = document.getElementById('endDate').value;
    if (!startStr || !endStr) return;

    const start = new Date(startStr + 'T00:00:00');
    const end = new Date(endStr + 'T23:59:59');

    const log = getLog();
    const filtered = log.filter(e => {
      const d = new Date(e.timeIn);
      return d >= start && d <= end;
    }).sort((a, b) => new Date(a.timeIn) - new Date(b.timeIn));

    const startLabel = fmtDateLabel(start);
    const endLabel = fmtDateLabel(end);
    const filename = `Visitor Log Report ${startLabel} - ${endLabel}`;

    // Build rows: Date | Name | Unit | Visitor Type | Reason | Time In | Time Out
    const headers = ['Date', 'Name', 'Unit', 'Visitor Type', 'Reason', 'Time In', 'Time Out'];
    const rows = filtered.map(e => {
      const din = new Date(e.timeIn);
      return [
        din.toLocaleDateString('en-US', { month:'2-digit', day:'2-digit', year:'2-digit' }),
        e.name,
        e.room,
        e.type,
        e.reason,
        formatTime(din),
        e.timeOut ? formatTime(new Date(e.timeOut)) : '---'
      ];
    });

    if (format === 'pdf') {
      exportPDF(filename, headers, rows, startLabel, endLabel);
    } else {
      exportExcel(filename, headers, rows);
    }
  }

  function exportPDF(filename, headers, rows, startLabel, endLabel) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });

    doc.setFontSize(16);
    doc.text('Visitor Log Report', 14, 18);
    doc.setFontSize(10);
    doc.setTextColor(100);
    doc.text(`${startLabel} – ${endLabel}  ·  ${rows.length} entries`, 14, 26);
    doc.setTextColor(0);

    doc.autoTable({
      head: [headers],
      body: rows,
      startY: 32,
      styles: { fontSize: 9, cellPadding: 3 },
      headStyles: { fillColor: [45, 90, 158], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [245, 245, 248] },
    });

    const blob = doc.output('blob');
    downloadBlob(blob, filename + '.pdf');
  }

  function exportExcel(filename, headers, rows) {
    const wsData = [headers, ...rows];
    const ws = XLSX.utils.aoa_to_sheet(wsData);

    // Column widths
    ws['!cols'] = [
      { wch: 10 }, // Date
      { wch: 22 }, // Name
      { wch: 6 },  // Unit
      { wch: 12 }, // Visitor Type
      { wch: 28 }, // Reason
      { wch: 10 }, // Time In
      { wch: 10 }, // Time Out
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Visitor Log');
    const wbOut = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbOut], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    downloadBlob(blob, filename + '.xlsx');
  }

  async function downloadBlob(blob, filename) {
    // Try artifact downloads capability first (works inside claude.ai viewer)
    try {
      const downloads = await window.claude?.use?.("downloads");
      if (downloads) {
        const buf = await blob.arrayBuffer();
        await downloads.save({ filename, data: new Uint8Array(buf) });
        return;
      }
    } catch(e) {}
    // Fallback for standalone Safari PWA
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  }

  // --- Clear data ---
  function clearData() {
    const ok = document.createElement('div');
    ok.className = 'modal-backdrop';
    ok.innerHTML = `
      <div class="modal" style="text-align:center;">
        <p style="margin:0 0 20px;font-size:1.1rem;font-weight:600;">Clear all visitor data?</p>
        <p style="margin:0 0 20px;font-size:0.9rem;color:var(--fg-muted);">This cannot be undone.</p>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
          <button class="modal-confirm" style="background:#C0392B;" id="confirmClearBtn">Clear</button>
        </div>
      </div>`;
    document.body.appendChild(ok);
    document.getElementById('confirmClearBtn').onclick = () => {
      try { localStorage.removeItem(DB_KEY); } catch(e) {}
      ok.remove();
    };
  }

  // --- Utilities ---
  function formatTime(d) {
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  }
  function fmtDateInput(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtDateLabel(d) {
    return String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0') + '.' + String(d.getFullYear()).slice(-2);
  }
  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  // Screen wake lock
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e) {}
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) requestWakeLock(); });
</script>
